name: Codex pull request review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  # Checks (case-insensitively) whether the PR title contains the opt-in
  # review tag. The tag itself is kept in a secret rather than hardcoded,
  # so it isn't visible to anyone browsing this public repo.
  check_trigger:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      match: ${{ steps.check.outputs.match }}
    steps:
      - name: Check PR title for review tag (case-insensitive)
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TRIGGER_TAG: ${{ secrets.REVIEW_TRIGGER_TAG }}
        run: |
          title_lower=$(printf '%s' "$PR_TITLE" | tr '[:upper:]' '[:lower:]')
          tag_lower=$(printf '%s' "$TRIGGER_TAG" | tr '[:upper:]' '[:lower:]')
          if [[ -n "$tag_lower" && "$title_lower" == *"$tag_lower"* ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs the standard review whenever a PR is opened or updated,
  # but only if check_trigger found the opt-in tag in the title
  codex_review:
    needs: check_trigger
    if: >
      github.event_name == 'pull_request' &&
      needs.check_trigger.outputs.match == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Pre-fetch base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-output.md

  post_review_feedback:
    runs-on: ubuntu-latest
    needs: codex_review
    if: github.event_name == 'pull_request' && needs.codex_review.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post or update Codex feedback
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-review-comment -->';
            const body = `${marker}\n${process.env.CODEX_FINAL_MESSAGE}`;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex_review.outputs.final_message }}

  # Runs when someone writes a comment starting with "@codex" on a PR
  codex_followup:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '@codex')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('number', pr.data.number);
            core.setOutput('base_ref', pr.data.base.ref);

      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          persist-credentials: false

      - name: Pre-fetch base and head refs
        env:
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex on the follow-up question
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: ${{ github.event.comment.body }}
          output-file: codex-output.md

  post_followup_feedback:
    runs-on: ubuntu-latest
    needs: codex_followup
    if: github.event_name == 'issue_comment' && needs.codex_followup.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post Codex follow-up reply
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex_followup.outputs.final_message }}
